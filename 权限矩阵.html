<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>角色权限矩阵表</title>
<style>
    table {
        border-collapse: collapse;
        width: 100%;
        font-size: 22px;
    }
    th, td {
        border: 1px solid #f0b888;
        text-align: center;
        padding: 12px 6px;
    }
    .header-bg {
        background-color: #ffe9d8;
        color: #e66722;
        font-weight: bold;
    }
    .role-name {
        color: #e66722;
        font-weight: bold;
    }

    /* ===== 斜表头 ===== */
    .split-cell {
        position: relative;
        min-width: 110px;
        height: 110px;
        padding: 0;
        /* 严格左上→右下对角线，线宽约 1.2px */
        background: linear-gradient(
            to bottom left,
            transparent calc(50% - 0.6px),
            #e66722 calc(50% - 0.6px),
            #e66722 calc(50% + 0.6px),
            transparent calc(50% + 0.6px)
        );
    }
    .split-cell .text-top {
        position: absolute;
        top: 8px;
        right: 10px;
        z-index: 2;
        line-height: 1;
    }
    .split-cell .text-bottom {
        position: absolute;
        bottom: 8px;
        left: 10px;
        z-index: 2;
        line-height: 1;
    }
</style>
</head>
<body>
<table>
    <thead>
    <tr class="header-bg">
        <th rowspan="2" class="split-cell">
            <span class="text-top">权限</span>
            <span class="text-bottom">角色</span>
        </th>
        <th colspan="4">考勤管理系统</th>
        <th colspan="4">作业管理系统</th>
    </tr>
    <tr class="header-bg">
        <th>请假申请</th>
        <th>修改学生<br>考勤</th>
        <th>查看本人<br>考勤</th>
        <th>查看当堂<br>学生考勤</th>
        <th>查看作业内容</th>
        <th>提交作业</th>
        <th>发布作业</th>
        <th>批改作业</th>
    </tr>
    </thead>
    <tbody>
    <tr><td class="role-name">授课教师</td><td>✕</td><td>✓</td><td>✕</td><td>✓</td><td>✓</td><td>✕</td><td>✓</td><td>✓</td></tr>
    <tr><td class="role-name">助教</td><td>✕</td><td>✕</td><td>✕</td><td>✕</td><td>✓</td><td>✕</td><td>✓</td><td>✓</td></tr>
    <tr><td class="role-name">学生</td><td>✓</td><td>✕</td><td>✓</td><td>✕</td><td>✓</td><td>✓</td><td>✕</td><td>✕</td></tr>
    </tbody>
</table>
</body>
</html>

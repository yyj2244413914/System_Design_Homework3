<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 智能课堂</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<div class="login-box">
  <!-- 左：登录表单 -->
  <div class="login-left">
    <span class="eyebrow">🌐 课堂聊天系统</span>
    <h1>欢迎回到<em>智能课堂</em></h1>

    <div id="msg" class="banner hide"></div>

    <form id="loginForm">
      <label for="username">用户名</label>
      <input id="username" type="text" value="t01" autocomplete="username" required>
      <label for="password">密码</label>
      <input id="password" type="password" value="123456" autocomplete="current-password" required>
      <button type="submit" id="btnLogin">进入课堂 →</button>
    </form>

    <div class="demo-accounts">
      教师 <code>t01</code> <code>t02</code> <code>t03</code>　
      助教 <code>a01</code>~<code>a06</code>　
      学生 <code>s01</code>~<code>s21</code>　密码 <code>123456</code>
    </div>
  </div>

  <!-- 右：数据库连通状态（真去问后端要的） -->
  <div class="login-right">
    <h2><span class="dot off" id="dot"></span>数据库连接</h2>

    <div class="kv">
      <b>状态</b><span id="hStatus">检测中…</span>
      <b>主机:端口</b><span id="hAddr" class="mono">—</span>
      <b>数据库</b><span id="hDb">—</span>
      <b>版本</b><span id="hVersion" class="small">—</span>
      <b>表数量</b><span id="hTables">—</span>
      <b>用户数</b><span id="hUsers">—</span>
      <b>聊天记录</b><span id="hRecords">—</span>
    </div>

    <p class="small" id="hError" style="margin-top:12px;color:#fecaca"></p>

    <button class="ghost sm" id="btnRecheck" type="button" style="margin-top:14px;align-self:flex-start">重新检测</button>
  </div>
</div>

<script src="js/api.js"></script>
<script>
async function checkHealth() {
  const status = document.getElementById('hStatus');
  const dot = document.getElementById('dot');
  dot.className = 'dot off';
  status.textContent = '检测中…';
  try {
    const h = await API.health();
    const on = !!h.ok;
    dot.className = 'dot ' + (on ? 'on' : 'off');
    status.textContent = on ? '连接正常' : '连接失败';
    document.getElementById('hAddr').textContent = h.db_host + ':' + h.db_port;
    document.getElementById('hDb').textContent = h.database;
    document.getElementById('hVersion').textContent = h.version || '—';
    document.getElementById('hTables').textContent = (h.tables ?? '—') + ' 张';
    document.getElementById('hUsers').textContent = (h.users ?? '—') + ' 人';
    document.getElementById('hRecords').textContent = (h.records ?? '—') + ' 条';
    document.getElementById('hError').textContent = h.error || '';
  } catch (e) {
    dot.className = 'dot off';
    status.textContent = '后端未启动';
    document.getElementById('hError').textContent = '请先双击 启动智慧课堂.bat';
  }
}

document.getElementById('btnRecheck').onclick = checkHealth;

document.getElementById('loginForm').onsubmit = async function (ev) {
  ev.preventDefault();
  const box = document.getElementById('msg');
  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    await API.login(document.getElementById('username').value.trim(),
                    document.getElementById('password').value);
    location.href = 'index.html';
  } catch (e) {
    banner(box, '登录失败：' + e.message, false);
    btn.disabled = false;
    btn.textContent = '进入课堂 →';
  }
};

checkHealth();

// 已经登录过（有有效 Cookie / Token）就直接进首页，省得重复登录
(async function autoEnter() {
  try {
    await API.me();
    location.replace('index.html');
  } catch (e) {
    /* 未登录：正常停在登录页 */
  }
})();
</script>
</body>
</html>
